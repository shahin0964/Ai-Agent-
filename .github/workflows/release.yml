name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Prepare Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/upload-key.jks || true
          fi
          if [ ! -f app/upload-key.jks ] || ! keytool -list -keystore app/upload-key.jks -storepass "${STORE_PASSWORD:-android}" >/dev/null 2>&1; then
            echo "Generating valid release keystore..."
            keytool -genkey -v -keystore app/upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -dname "CN=Android Release, O=Android, C=US" -storepass android -keypass android
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Clean Keystore
        if: always()
        run: rm -f app/upload-key.jks

      - name: Get Version Name
        id: version
        run: |
          VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag will be v$VERSION"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Nexus AI Release v${{ steps.version.outputs.version_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
